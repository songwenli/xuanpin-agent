database:
  path: data/products.db

reports:
  directory: reports
  top_n: 30

scoring:
  weights:
    rank_position: 0.25
    review_count: 0.15
    like_or_save_count: 0.25

scraping:
  timeout_seconds: 20
  delay_seconds:
    min: 1.0
    max: 3.0
  user_agent: "DressSelectionAgent/0.1 (+contact: configure-before-production)"

sites:
  americanthreads:
    enabled: true
    base_url: https://www.shopamericanthreads.com
    collection_urls:
      - https://www.shopamericanthreads.com/collections/prom
    max_products: 60
  ohpolly:
    enabled: true
    base_url: https://us.ohpolly.com
    collection_urls:
      - https://us.ohpolly.com/collections/prom-dresses
    json_collection_urls:
      - https://us.ohpolly.com/collections/prom-dresses/products.json?limit=60
    max_products: 60
  meshki:
    enabled: true
    base_url: https://www.meshki.us
    collection_urls:
      - https://www.meshki.us/collections/prom-dresses
    max_products: 60
  princesspolly:
